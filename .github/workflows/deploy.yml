name: Deploy to GitHub Pages

# Publishes the app and stamps sw.js with the commit id, so every push is a new version
# that installed (home-screen) apps detect and reload into automatically.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: node tests/run.mjs
      - name: Stamp version
        run: |
          sed -i "s/^const VERSION = '.*';/const VERSION = 'hubog-${GITHUB_SHA::8}';/" sw.js
          grep -n "^const VERSION" sw.js
      - name: Collect site files
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js fonts icons _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
